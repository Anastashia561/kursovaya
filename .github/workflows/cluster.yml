name: Kubernetes integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Create isolated Minikube with Calico
        run: |
          curl -fsSLo /tmp/minikube https://storage.googleapis.com/minikube/releases/v1.36.0/minikube-linux-amd64
          sudo install /tmp/minikube /usr/local/bin/minikube
          minikube start -p ubi193 --driver=docker --cni=calico --cpus=2 --memory=4096 --kubernetes-version=v1.33.1
      - name: Deploy services databases TLS and monitoring
        run: python -m scripts.deploy --profile ubi193
      - name: Exercise all rules TLS roles events and network isolation
        run: python -m scripts.smoke --cluster
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p test-results
          kubectl get pods -A -o wide > test-results/pods.txt || true
          kubectl get events -A --sort-by=.lastTimestamp > test-results/events.txt || true
          for name in gateway-service security-service auth-service log-service; do
            kubectl -n security logs deployment/$name --all-containers --tail=80 > test-results/$name.log 2>&1 || true
          done
          kubectl -n security logs job/bootstrap > test-results/bootstrap.log 2>&1 || true
          kubectl -n monitoring logs deployment/prometheus --tail=80 > test-results/prometheus.log 2>&1 || true
          kubectl -n monitoring logs deployment/grafana --tail=80 > test-results/grafana.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-results
          path: test-results/
      - name: Remove temporary cluster
        if: always()
        run: minikube delete -p ubi193 || true
