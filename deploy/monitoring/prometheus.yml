global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: security-pods
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - security
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app
    action: keep
    regex: security-service
  - source_labels:
    - __meta_kubernetes_pod_container_port_number
    action: keep
    regex: '8081'
