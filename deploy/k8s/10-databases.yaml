apiVersion: v1
kind: Service
metadata:
  name: security-db
  namespace: security
spec:
  selector:
    app: security-db
  ports:
  - name: db
    port: 5432
    targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: security-db
  namespace: security
spec:
  serviceName: security-db
  replicas: 1
  selector:
    matchLabels:
      app: security-db
  template:
    metadata:
      labels:
        app: security-db
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: postgres:16.8-bookworm
        env:
        - name: POSTGRES_DB
          value: security
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: service-config
              key: DB_PASSWORD
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - security
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
