worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  map_hash_bucket_size 128;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $uri $target_host {
    default "";
    ~^/ext/([a-z0-9][a-z0-9.-]*)/echo$ $1;
  }
  map $target_host $route_host {
    default "";
    external-service.external.svc.cluster.local external-service.external.svc.cluster.local;
  }
  server {
    listen 8080;
    client_max_body_size 1m;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    resolver DNS_RESOLVER valid=10s ipv6=off;
    location = /healthz { return 200 "alive"; }
    location = /_check {
      internal;
      proxy_pass http://security-service.security.svc.cluster.local:8081/api/v1/check;
      proxy_pass_request_body off;
      proxy_pass_request_headers off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Gateway-Key "GATEWAY_SECRET";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $original_method;
      proxy_set_header X-Source-IP $remote_addr;
      proxy_set_header X-Body-Size $http_content_length;
      proxy_set_header X-Body-Type $http_content_type;
    }
    location ~ ^/ext/[a-z0-9][a-z0-9.-]*/echo$ {
      set $original_method $request_method;
      if ($request_method != POST) { return 405; }
      if ($is_args != "") { return 400; }
      if ($http_transfer_encoding != "") { return 411; }
      if ($http_content_length !~ "^[0-9]{1,7}$") { return 411; }
      auth_request /_check;
      proxy_request_buffering on;
      proxy_http_version 1.1;
      proxy_next_upstream off;
      proxy_pass_request_headers off;
      proxy_set_header Host $route_host;
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header Content-Length $http_content_length;
      proxy_set_header Connection "";
      proxy_ssl_server_name on;
      proxy_ssl_name $route_host;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /run/tls/ca.crt;
      proxy_pass https://$route_host:443/echo;
    }
    location / { return 404; }
  }
}
