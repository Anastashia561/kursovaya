apiVersion: v1
kind: Service
metadata:
  name: security-service
  namespace: security
spec:
  selector:
    app: security-service
  ports:
  - name: http
    port: 8081
    targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-service
  namespace: security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: security-service
  template:
    metadata:
      labels:
        app: security-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: true
      containers:
      - name: security-service
        image: ubi193:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: SERVICE
          value: security_service
        - name: PORT
          value: '8081'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: service-config
              key: SECURITY_DATABASE_URL
        - name: GATEWAY_KEY
          valueFrom:
            secretKeyRef:
              name: service-config
              key: GATEWAY_KEY
        - name: LOG_KEY
          valueFrom:
            secretKeyRef:
              name: service-config
              key: LOG_KEY
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: jwt-public
          mountPath: /run/ubi193
          readOnly: true
        startupProbe:
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 5
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
      - name: jwt-public
        secret:
          secretName: jwt-public
      serviceAccountName: security-service
---
