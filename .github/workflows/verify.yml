name: Verify microservices
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8-bookworm
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ubi193_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Unit and HTTP tests with real PostgreSQL row locks
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5432/ubi193_test
        run: python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Generated manifests match source
        run: |
          python -m scripts.build_manifests
          git diff --exit-code -- deploy/
      - name: Build runtime image
        run: docker build -t ubi193:dev .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: test-results/
